<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <meta name="description" content="Welcome guide" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero-content">
      <h1 id="property-name">Property Name</h1>
      <p id="tagline"></p>
    </div>
  </header>

  <main>

    <section class="card" id="section-welcome" aria-labelledby="welcome-heading">
      <h2 id="welcome-heading">Welcome</h2>
      <p id="welcome-message"></p>
    </section>

    <section class="card" id="section-basics" aria-labelledby="basics-heading">
      <h2 id="basics-heading">The basics</h2>
      <dl class="detail-list" id="basics-details"></dl>
    </section>

    <section class="card" id="section-checkin" aria-labelledby="checkin-heading">
      <h2 id="checkin-heading">Checking in</h2>
      <div class="note-list" id="checkin-details"></div>
    </section>

    <section class="card" id="section-checkout" aria-labelledby="checkout-heading">
      <h2 id="checkout-heading">Checking out</h2>
      <div class="note-list" id="checkout-details"></div>
    </section>

    <section class="card" id="section-rules" aria-labelledby="rules-heading">
      <h2 id="rules-heading">House rules</h2>
      <ul id="rules-list"></ul>
    </section>

    <section class="card" id="section-amenities" aria-labelledby="amenities-heading">
      <h2 id="amenities-heading">Amenities</h2>
      <ul id="amenities-list"></ul>
    </section>

    <section class="card" id="section-recs" aria-labelledby="recs-heading">
      <h2 id="recs-heading">Neighborhood spots</h2>
      <div id="recs-list"></div>
    </section>

    <section class="card" id="section-emergency" aria-labelledby="emergency-heading">
      <h2 id="emergency-heading">In an emergency</h2>
      <div class="note-list" id="emergency-details"></div>
    </section>

  </main>

  <footer>
    <p>Questions? Reach out any time.</p>
  </footer>

  <script src="assets/js/render.js"></script>
</body>
</html>
